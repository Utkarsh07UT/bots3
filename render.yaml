services:
  - type: web
    name: cyber-threat-ai-bots
    runtime: python
    buildCommand: pip install -r requirements-ai.txt && python -c "from ai_service import ensure_models; ensure_models()"
    startCommand: uvicorn ai_service:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
